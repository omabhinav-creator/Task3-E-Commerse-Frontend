<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Om Abhinav's Store</title>
    <link rel="stylesheet" href="../Assets/CSS/style.css">
</head>
<body>
    <header class="header">
        <div class="logo"><h2>Om Abhinav's E-Commerce Store</h2></div>
        <nav class="nav">
            <a href="home.html">Home</a>
            <a href="products.html">Products</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="cart.html" class="active">Cart <span id="nav-cart-badge" class="badge">0</span></a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </header>

    <div class="cart-wrapper">
        <h2>Your Shopping Cart</h2>
        
        <div id="cart-items" class="cart-box">
            <!-- JS Inject Cart Items Here -->
        </div>

        <div class="checkout-box">
            <h2 style="color: var(--text-secondary);">Total: <span id="cart-total" style="color: var(--text-primary);">₹0</span></h2>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <script src="../Assets/JS/products.js"></script>
    <script src="../Assets/JS/app.js"></script>
</body>
</html>
